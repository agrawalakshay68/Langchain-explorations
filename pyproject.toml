[project]
name = "langchain-explorations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshay Agrawal", email = "agrawalakshay68@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.2",
    "tavily>=1.1.0",
]

[project.scripts]
langchain-explorations = "langchain_explorations:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
